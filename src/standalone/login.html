<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediction Arena - Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@550;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #09090b;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.04) 0%, transparent 40%);
      font-family: 'Outfit', sans-serif;
    }
    .glass {
      background: rgba(15, 15, 22, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.12);
    }
    .gold-text {
      background: linear-gradient(135deg, #f6e0a4 0%, #d4af37 50%, #aa7c11 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full mb-6 text-center">
    <h1 class="text-3xl font-black uppercase text-zinc-100 tracking-tight" style="font-family: 'Space Grotesk', sans-serif;">
      Prediction <span class="gold-text">Arena</span>
    </h1>
    <p class="text-xs text-zinc-400 mt-1">Place forecasts, master multipliers, and claim victories in real-time</p>
  </div>

  <div class="max-w-md w-full glass rounded-3xl p-6 md:p-8 shadow-2xl relative overflow-hidden border border-gold/10">
    <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-500/5 rounded-full blur-2xl"></div>
    <div class="absolute top-0 left-0 w-full h-[3px] bg-gradient-to-r from-yellow-700 via-yellow-500 to-yellow-200"></div>

    <h2 class="text-xl font-bold text-zinc-100 mb-6 font-display uppercase tracking-wide">Secure Login</h2>

    <form id="login-form" class="space-y-4">
      <div class="space-y-1">
        <label class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider font-display">Email Address</label>
        <input 
          type="email" 
          id="email-input" 
          required 
          placeholder="e.g. bettor@game.com" 
          class="w-full px-4 py-3 bg-zinc-950 border border-zinc-900 focus:border-yellow-500/40 rounded-xl text-zinc-200 text-sm outline-none transition-colors"
        >
      </div>

      <div class="space-y-1">
        <label class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider font-display">Secret Password</label>
        <input 
          type="password" 
          id="password-input" 
          required 
          placeholder="••••••••" 
          class="w-full px-4 py-3 bg-zinc-950 border border-zinc-900 focus:border-yellow-500/40 rounded-xl text-zinc-200 text-sm outline-none transition-colors"
        >
      </div>

      <button 
        type="submit" 
        id="submit-btn" 
        class="w-full py-3.5 rounded-xl cursor-pointer bg-gradient-to-r from-yellow-600 via-yellow-400 to-yellow-200 text-neutral-950 font-bold hover:brightness-105 active:scale-[0.98] transition-all text-xs uppercase tracking-wider font-display"
      >
        Sign In to Platform
      </button>
    </form>

    <div class="mt-6 pt-5 border-t border-zinc-900 text-center text-xs text-zinc-500 whitespace-nowrap">
      <span>New predictor in town?</span>
      <a href="register.html" class="text-yellow-500 font-bold hover:underline ml-1">Create free profile</a>
    </div>
  </div>

  <script type="module">
    import { login } from "./js/auth.js";

    const form = document.getElementById("login-form");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email-input").value;
      const pass = document.getElementById("password-input").value;

      submitBtn.textContent = "Processing Account Access...";
      submitBtn.disabled = true;

      try {
        await login(email, pass);
        window.location.href = "dashboard.html";
      } catch (err) {
        alert(err.message || "Invalid authentication credentials. Please try again.");
        submitBtn.textContent = "Sign In to Platform";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
