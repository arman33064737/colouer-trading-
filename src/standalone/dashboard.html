<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CP-Prediction Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@550;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #09090b;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.04) 0%, transparent 40%);
      font-family: 'Outfit', sans-serif;
    }
    .glass {
      background: rgba(15, 15, 22, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.12);
    }
    .gold-text {
      background: linear-gradient(135deg, #f6e0a4 0%, #d4af37 50%, #aa7c11 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen text-zinc-100 pb-12">

  <!-- NAVIGATION HEADER -->
  <header class="sticky top-0 z-40 w-full glass border-b border-yellow-500/10 px-4 md:px-8 py-3.5 mb-8">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="font-display font-black text-lg gold-text leading-none uppercase">CP-GOLD</span>
        <span class="hidden sm:inline text-[9px] font-mono text-zinc-500 bg-zinc-950 px-2.5 py-1 rounded-full border border-zinc-800 uppercase">Live Host</span>
      </div>

      <div class="flex items-center gap-4 text-xs font-semibold">
        <a href="dashboard.html" class="text-yellow-500 underline decoration-2">Dashboard</a>
        <a href="wallet.html" class="text-zinc-400 hover:text-zinc-200">Wallet</a>
        <a href="history.html" class="text-zinc-400 hover:text-zinc-200">History</a>
        <a href="admin.html" id="admin-link" class="hidden text-zinc-400 hover:text-rose-400 font-bold">Admin</a>
        <button id="logout-btn" class="p-2 rounded bg-zinc-900 border border-zinc-800 hover:border-yellow-500/20 text-zinc-400 hover:text-yellow-500 text-[10px] uppercase font-mono tracking-wider font-extrabold cursor-pointer">Logout</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- LEFT SIDE: ACTIVE CONTENDER & CHIPPLACER -->
    <div class="lg:col-span-7 flex flex-col gap-6">
      <div class="glass rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center gap-6 relative overflow-hidden">
        <div>
          <span class="text-[10px] font-mono font-bold tracking-widest text-zinc-500 uppercase flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Active Prediction Period
          </span>
          <h2 id="round-id-title" class="text-3xl font-display font-black text-zinc-100 gold-text tracking-wide mt-1">R-SYNCING</h2>
          <p class="text-xs text-zinc-400 mt-2 max-w-sm">Wager bounds automatically settle at round endpoints. Place prediction colors below.</p>
        </div>

        <!-- TIMER -->
        <div class="w-32 h-32 rounded-full bg-zinc-950 flex items-center justify-center border border-zinc-900 shadow">
          <div class="text-center">
            <span class="text-[9px] text-zinc-500 font-mono uppercase tracking-widest">Time Left</span>
            <span id="seconds-left-txt" class="text-4xl font-display font-black block my-0.5">30s</span>
            <span id="lock-badge" class="text-[9px] uppercase font-mono px-1.5 py-0.5 rounded bg-zinc-900 font-extrabold text-emerald-400">Open</span>
          </div>
        </div>
      </div>

      <!-- BET SELECTOR -->
      <div class="glass rounded-2xl p-6">
        <h3 class="text-base font-bold text-zinc-100 font-display uppercase tracking-wider mb-5">Predict Outcome Color</h3>

        <div id="betting-form" class="space-y-6">
          <div class="grid grid-cols-3 gap-3">
            <button id="color-green" class="p-4 rounded-xl border border-zinc-850 hover:bg-zinc-900/40 text-center flex flex-col items-center gap-2 cursor-pointer transition-all">
              <span class="w-8 h-8 rounded-full bg-emerald-500 block shadow"></span>
              <span class="font-bold text-xs">Green (2.0x)</span>
            </button>
            <button id="color-violet" class="p-4 rounded-xl border border-zinc-850 hover:bg-zinc-900/40 text-center flex flex-col items-center gap-2 cursor-pointer transition-all">
              <span class="w-8 h-8 rounded-full bg-violet-500 block shadow"></span>
              <span class="font-bold text-xs">Violet (4.5x)</span>
            </button>
            <button id="color-red" class="p-4 rounded-xl border border-zinc-850 hover:bg-zinc-900/40 text-center flex flex-col items-center gap-2 cursor-pointer transition-all">
              <span class="w-8 h-8 rounded-full bg-rose-500 block shadow"></span>
              <span class="font-bold text-xs">Red (2.0x)</span>
            </button>
          </div>

          <div class="space-y-3">
            <div class="flex justify-between items-center text-xs font-mono font-bold text-zinc-400 bg-zinc-950 p-3 rounded-xl border border-zinc-900">
              <span>Prediction Amount</span>
              <span id="bet-amount-title" class="text-yellow-500 text-sm">100 Coins</span>
            </div>

            <div class="grid grid-cols-4 gap-2">
              <button type="button" class="preset-btn py-1.5 bg-zinc-950 rounded text-xs hover:border-yellow-500/20 border border-zinc-900 font-mono" data-val="100">100</button>
              <button type="button" class="preset-btn py-1.5 bg-zinc-950 rounded text-xs hover:border-yellow-500/20 border border-zinc-900 font-mono" data-val="500">500</button>
              <button type="button" class="preset-btn py-1.5 bg-zinc-950 rounded text-xs hover:border-yellow-500/20 border border-zinc-900 font-mono" data-val="1000">1K</button>
              <button type="button" class="preset-btn py-1.5 bg-zinc-950 rounded text-xs hover:border-yellow-500/20 border border-zinc-900 font-mono" data-val="5000">5K</button>
            </div>
          </div>

          <button id="place-bet-btn" class="w-full py-4 rounded-xl font-bold bg-gradient-to-r from-yellow-600 to-yellow-400 text-zinc-950 cursor-pointer text-xs uppercase tracking-wider font-display">Confirm Bet prediction</button>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE: RECENT DRAW OUTCOMES -->
    <div class="lg:col-span-5 flex flex-col gap-6">
      <div class="glass rounded-2xl p-6 flex flex-col gap-4">
        <h3 class="text-sm font-bold font-display uppercase tracking-wider text-zinc-300">Recent Rounds drawn</h3>
        <div id="rounds-history-grid" class="grid grid-cols-4 sm:grid-cols-5 gap-3">
          <!-- Populated by JS -->
        </div>
      </div>

      <div class="glass rounded-2xl p-6 flex flex-col gap-4 flex-grow min-h-[250px]">
        <h3 class="text-sm font-bold font-display uppercase tracking-wider text-zinc-300">Live Active Predictions Feed</h3>
        <div id="live-bets-feed" class="space-y-2 max-h-[250px] overflow-y-auto">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

  </main>

  <script type="module">
    import { checkAuthState, logout } from "./js/auth.js";
    import { getRoundDetailsAt, placeWager, subscribeRounds, subscribeActiveBets, settleRound } from "./js/game.js";

    let activeUser = null;
    let selectedColor = null;
    let betAmount = 100;
    let currentRoundId = "";
    let secondsLeft = 30;

    // Settle lock triggers
    const roundIdTitle = document.getElementById("round-id-title");
    const secondsLeftTxt = document.getElementById("seconds-left-txt");
    const lockBadge = document.getElementById("lock-badge");
    const adminLink = document.getElementById("admin-link");

    // Secure checking
    checkAuthState(
      (profile) => {
        activeUser = profile;
        if (profile.isAdmin) adminLink.classList.remove("hidden");
      },
      () => {
        window.location.href = "login.html";
      }
    );

    // Clock synchronized
    setInterval(() => {
      const now = Date.now();
      const details = getRoundDetailsAt(now);
      
      currentRoundId = details.roundId;
      secondsLeft = details.secondsLeft;

      roundIdTitle.textContent = details.roundId;
      secondsLeftTxt.textContent = details.secondsLeft + "s";

      if (details.secondsLeft <= 5) {
        lockBadge.textContent = "Locked";
        lockBadge.className = "text-[9px] uppercase font-mono px-1.5 py-0.5 rounded bg-zinc-900 font-extrabold text-rose-500";
      } else {
        lockBadge.textContent = "Open";
        lockBadge.className = "text-[9px] uppercase font-mono px-1.5 py-0.5 rounded bg-zinc-900 font-extrabold text-emerald-400";
      }

      // Auto settle trigger check
      if (details.secondsLeft === 0) {
        const index = parseInt(details.roundId.replace("R", "")) - 1;
        settleRound("R" + index).catch(console.error);
      }
    }, 1000);

    // Color buttons selections triggers
    const btns = {
      green: document.getElementById("color-green"),
      violet: document.getElementById("color-violet"),
      red: document.getElementById("color-red")
    };

    Object.keys(btns).forEach(col => {
      btns[col].addEventListener("click", () => {
        if (secondsLeft <= 5) {
          alert("Wagers locked for active settle period!");
          return;
        }
        selectedColor = col;
        Object.keys(btns).forEach(c => btns[c].className = "p-4 rounded-xl border border-zinc-850 hover:bg-zinc-900/40 text-center flex flex-col items-center gap-2 cursor-pointer transition-all");
        btns[col].className = "p-4 rounded-xl border border-yellow-500 hover:bg-zinc-900/40 text-center flex flex-col items-center gap-2 cursor-pointer transition-all bg-zinc-900/50 shadow shadow-yellow-500/10";
      });
    });

    // Preset amounts chips
    const presets = document.querySelectorAll(".preset-btn");
    const amountTitle = document.getElementById("bet-amount-title");
    presets.forEach(preset => {
      preset.addEventListener("click", () => {
        betAmount = parseInt(preset.getAttribute("data-val"));
        amountTitle.textContent = betAmount.toLocaleString() + " Coins";
      });
    });

    // Bet Confirm Triggers
    const placeBetBtn = document.getElementById("place-bet-btn");
    placeBetBtn.addEventListener("click", async () => {
      if (!selectedColor) {
        alert("Please select a target color prediction.");
        return;
      }
      if (secondsLeft <= 5) {
        alert("Wagers locked for active settle period!");
        return;
      }
      try {
        await placeWager(activeUser, currentRoundId, selectedColor, betAmount);
        alert("Success! Prediction bet of " + betAmount + " placed.");
        selectedColor = null;
        Object.keys(btns).forEach(c => btns[c].className = "p-4 rounded-xl border border-zinc-850 hover:bg-zinc-900/40 text-center flex flex-col items-center gap-2 cursor-pointer transition-all");
      } catch (err) {
        alert(err.message || "Failed placing bet.");
      }
    });

    // Subscriptions setup
    const historyGrid = document.getElementById("rounds-history-grid");
    subscribeRounds((rounds) => {
      historyGrid.innerHTML = "";
      rounds.slice(0, 15).forEach(r => {
        const card = document.createElement("div");
        card.className = "flex flex-col items-center bg-zinc-950/40 p-2.5 border border-zinc-900 rounded-xl";
        card.innerHTML = `
          <span class="text-[8px] font-mono text-zinc-500 mb-1.5 uppercase font-bold">R${r.id.slice(-4)}</span>
          <span class="w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs ${
            r.resultColor === 'red' ? 'bg-rose-500' : r.resultColor === 'green' ? 'bg-emerald-500' : 'bg-violet-500'
          }">${r.resultNumber}</span>
        `;
        historyGrid.appendChild(card);
      });
    });

    // Logout
    document.getElementById("logout-btn").addEventListener("click", async () => {
      await logout();
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
